[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.2.0",
    "fastapi>=0.162.0",
    "pillow>=12.0.0",
    "pypdf>=6.0.0",
    "PyJWT>=2.10.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "httpx2>=2.16.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
