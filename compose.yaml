services:
  api:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      DOCUMENT_STORAGE_PATH: /app/var/documents
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - loan_documents:/app/var/documents
    restart: unless-stopped
  notification-worker:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
    command: ["python", "-m", "app.services.notification_worker"]
    profiles: ["notifications"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  loan_documents:
